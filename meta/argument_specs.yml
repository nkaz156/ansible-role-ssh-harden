---
argument_specs:
  main:
    short_description: Harden the OpenSSH server on RHEL-family systems
    description:
      - Deploys an sshd drop-in that enforces key-only authentication, disables
        root login, restricts access with AllowGroups and tightens timeouts and
        forwarding. Optionally restricts SSH to trusted sources with firewalld.
    author:
      - nkaz156
    options:
      ssh_harden_password_authentication:
        description: Allow password authentication.
        type: bool
        default: false
      ssh_harden_kbd_interactive_authentication:
        description: Allow keyboard-interactive (PAM password prompt) authentication.
        type: bool
        default: false
      ssh_harden_pubkey_authentication:
        description:
          - Allow public key authentication.
          - The role fails if this, O(ssh_harden_password_authentication) and
            O(ssh_harden_kbd_interactive_authentication) are all false.
        type: bool
        default: true
      ssh_harden_permit_root_login:
        description: Value for PermitRootLogin.
        type: str
        default: "no"
        choices:
          - "no"
          - prohibit-password
      ssh_harden_allow_groups:
        description: Groups whose members may log in over SSH (AllowGroups).
        type: list
        elements: str
        default:
          - sshusers
      ssh_harden_create_allow_groups:
        description: Create the groups in O(ssh_harden_allow_groups) if they are missing.
        type: bool
        default: true
      ssh_harden_allow_group_members:
        description:
          - Existing users to add to the allowed groups, keyed by group name.
          - Each key must be listed in O(ssh_harden_allow_groups). Users are never created.
        type: dict
        default: {}
      ssh_harden_lockout_check:
        description:
          - Fail before changing sshd if no allowed group has members, or the
            user Ansible connects as over SSH would be denied.
        type: bool
        default: true
      ssh_harden_permit_empty_passwords:
        description: Allow login to accounts with empty passwords.
        type: bool
        default: false
      ssh_harden_login_grace_time:
        description: Seconds a client has to authenticate (LoginGraceTime).
        type: int
        default: 30
      ssh_harden_max_auth_tries:
        description: Authentication attempts allowed per connection (MaxAuthTries).
        type: int
        default: 3
      ssh_harden_x11_forwarding:
        description: Allow X11 forwarding.
        type: bool
        default: false
      ssh_harden_allow_agent_forwarding:
        description: Allow SSH agent forwarding.
        type: bool
        default: false
      ssh_harden_allow_tcp_forwarding:
        description: Value for AllowTcpForwarding.
        type: str
        default: "no"
        choices:
          - "no"
          - "yes"
          - local
          - remote
          - all
      ssh_harden_host_key_types:
        description: Host key types sshd offers. Missing keys are generated (RSA at 4096 bits).
        type: list
        elements: str
        choices:
          - ed25519
          - rsa
          - ecdsa
        default:
          - ed25519
          - rsa
      ssh_harden_client_alive_interval:
        description: Seconds between keep-alive probes to idle clients (ClientAliveInterval).
        type: int
        default: 300
      ssh_harden_client_alive_count_max:
        description: Missed keep-alives before disconnecting (ClientAliveCountMax).
        type: int
        default: 2
      ssh_harden_banner_enabled:
        description: Show a warning banner before authentication.
        type: bool
        default: true
      ssh_harden_banner_path:
        description: Path of the banner file.
        type: path
        default: /etc/ssh/banner
      ssh_harden_banner_text:
        description: Text of the warning banner.
        type: str
        default: Authorized access only. All activity is monitored and logged.
      ssh_harden_extra_options:
        description: Extra sshd directives to add to the drop-in, as name/value pairs.
        type: dict
        default: {}
      ssh_harden_firewall_manage:
        description: Restrict SSH with firewalld to O(ssh_harden_firewall_allowed_sources).
        type: bool
        default: false
      ssh_harden_firewall_zone:
        description: firewalld zone to manage.
        type: str
        default: public
      ssh_harden_firewall_allowed_sources:
        description: IPv4/IPv6 addresses or CIDRs allowed to reach SSH when the firewall is managed.
        type: list
        elements: str
        default: []
