---
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/inventory/
  cfg:
    defaults:
      host_key_checking: false
      # molecule/roles/ssh_harden links to the repository root, so the role
      # resolves by name whatever the checkout directory is called
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/molecule/roles
  env:
    ANSIBLE_FORCE_COLOR: "true"

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
