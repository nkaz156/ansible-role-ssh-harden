---
name: CI
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The ansible-lint pre-commit hook pins language_version: python3.14
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # pre-commit/action still uses actions/cache@v4 (Node 20), so the hooks are
      # run directly with an up-to-date cache action instead
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks developers run locally: yamllint, ansible-lint, gitleaks and
      # basic file hygiene
      - name: Run pre-commit hooks
        run: |
          pip install -r requirements-lint.txt
          pre-commit run --all-files --show-diff-on-failure --color=always

      # The pre-commit gitleaks hook only scans staged changes, so scan the
      # full history here as well
      - name: Scan git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" docker.io/zricethezav/gitleaks:v8.30.1
          git --redact --verbose /repo

  molecule:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - custom
        image:
          - docker.io/rockylinux/rockylinux:10.2
          - docker.io/rockylinux/rockylinux:9
    name: molecule (${{ matrix.scenario }}, ${{ matrix.image }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install molecule
        run: pip install -r requirements-dev.txt

      - name: Run molecule
        run: molecule test -s ${{ matrix.scenario }}
        env:
          ANSIBLE_FORCE_COLOR: "true"
          PY_COLORS: "1"
          SSH_HARDEN_TEST_IMAGE: ${{ matrix.image }}
