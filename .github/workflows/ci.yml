---
name: CI
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The ansible-lint pre-commit hook pins language_version: python3.14
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      # Same hooks developers run locally: yamllint, ansible-lint, gitleaks and
      # basic file hygiene
      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      # The pre-commit gitleaks hook only scans staged changes, so scan the
      # full history here as well
      - name: Scan git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" docker.io/zricethezav/gitleaks:v8.30.1
          git --redact --verbose /repo

  molecule:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - custom
        image:
          - docker.io/rockylinux/rockylinux:10.2
          - docker.io/rockylinux/rockylinux:9
    name: molecule (${{ matrix.scenario }}, ${{ matrix.image }})
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install molecule
        run: pip install -r requirements-dev.txt

      - name: Run molecule
        run: molecule test -s ${{ matrix.scenario }}
        env:
          ANSIBLE_FORCE_COLOR: "true"
          PY_COLORS: "1"
          SSH_HARDEN_TEST_IMAGE: ${{ matrix.image }}
